services:
  runtime:
    build: .
    container_name: lossfunction
    environment:
      # SQLite file inside the mounted volume survives redeploys/restarts.
      DATABASE_PATH: /data/lossfunction.db
      TRADING_MODE: ${TRADING_MODE:-paper}
      # Synthetic paper market so the status page shows a living pipeline.
      DEMO_LOOP: ${DEMO_LOOP:-true}
      # Secrets (KIS_*, GLM_*) come from the host env or an env-file — never
      # baked into the image or the repository.
    env_file:
      - path: .env
        required: false
    volumes:
      - lossfunction-data:/data
    ports:
      # Health endpoint bound to the host loopback only; check via SSH:
      #   ssh vault 'curl -s http://127.0.0.1:18080/healthz'
      - "127.0.0.1:18080:8080"
    mem_limit: 150m
    memswap_limit: 350m
    restart: unless-stopped

volumes:
  lossfunction-data:
